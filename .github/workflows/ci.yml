name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: api · pytest (python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -v
      # requirements.txt pulls in api/ + loader/requirements.txt — the exact pins the images ship.
      - run: pip-audit -r requirements.txt --progress-spinner off
      - run: ruff check .
      - run: black --check .

  web:
    name: web · tsc + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: ./node_modules/.bin/tsc --noEmit
      - run: npm test
      # Tailwind 3's postcss-selector-parser chain stays at moderate until Tailwind 4.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  cdk:
    name: cdk · jest invariants
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra-cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra-cdk/package-lock.json
      - run: npm ci
      - run: npm test --if-present
      - run: npm audit --audit-level=high
