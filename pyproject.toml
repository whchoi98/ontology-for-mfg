[project]
name = "ontology-for-mfg"
version = "0.6.0"
description = "Hi-Tech manufacturing ontology PoC — 22-class knowledge graph + 12 scenarios + agentic AI"
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI parameter markers in signatures are the framework idiom, not shared defaults.
extend-immutable-calls = ["fastapi.Body", "fastapi.Query", "fastapi.Path", "fastapi.Depends", "fastapi.Header", "fastapi.Cookie"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning:requests_aws4auth.*",
    "ignore::DeprecationWarning:fastapi.*",
]
